<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — BJJ Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@300;400;500;600;700&family=Bebas+Neue&family=Shippori+Mincho:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.style.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="login-body">
    <div class="hero-noise"></div>
    <div class="hero-grid"></div>
    
    <header class="top-nav login-nav">
        <div class="logo">
            <svg class="logo-mark" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
                <polygon points="16,2 30,10 30,22 16,30 2,22 2,10" fill="none" stroke="#c41230" stroke-width="2"/>
                <circle cx="16" cy="16" r="3" fill="#c41230"/>
            </svg>
            BJJ <span class="logo-accent">Assistant</span>
        </div>
    </header>

    <main class="login-main">
        <div class="login-card">
            <div class="login-card-header">
                <span class="sidebar-section-num">AUTH // 01</span>
                <h1 class="login-title">DOJO <span class="logo-accent">ACCESS</span></h1>
                <p class="login-subtitle">Enter the library by verifying your identity.</p>
            </div>

            <form id="login-form" class="login-form">
                <div class="login-input-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="username" name="username" placeholder="Enter username" required>
                    </div>
                </div>
                <div class="login-input-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" id="login-button" class="login-btn-primary">
                    <i class="fa-solid fa-right-to-bracket"></i> Login
                </button>
            </form>

            <div class="login-divider">
                <span class="divider-line"></span>
                <span class="divider-text">OR</span>
                <span class="divider-line"></span>
            </div>

            <div id="google-signin-btn" class="google-btn-container"></div>

            <div id="error-message" class="login-error" role="alert"></div>
            
            <div class="login-footer">
                <span class="sidebar-title-jp">柔術 · LIBRARY</span>
            </div>
        </div>
    </main>

    <script src="login.script.js"></script>
</body>
</html>
